<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logo Concept Previews</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@800&family=Cairo:wght@800&display=swap');
        body {
            background: #080a0e;
            color: white;
            font-family: 'Outfit', sans-serif;
            display: flex;
            flex-direction: column;
            gap: 50px;
            padding: 50px;
            align-items: center;
        }
        .concept-container {
            border: 1px solid rgba(255,121,0,0.2);
            padding: 40px;
            border-radius: 20px;
            background: #0d1117;
            text-align: center;
            width: 100%;
            max-width: 600px;
        }
        h2 { font-family: 'Cairo', sans-serif; margin-top: 0; color: #aaa; font-size: 1.2rem; margin-bottom: 30px;}
        
        /* Idea 1: Tech SVG & Glowing Glow */
        .idea-1 {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }
        .tech-icon {
            color: #FF7900;
            filter: drop-shadow(0 0 10px rgba(255, 121, 0, 0.4));
            animation: pulse 2s infinite ease-in-out;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); filter: drop-shadow(0 0 10px rgba(255, 121, 0, 0.4)); }
            50% { transform: scale(1.1); filter: drop-shadow(0 0 20px rgba(255, 121, 0, 0.8)); }
        }
        .text-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .orange-txt {
            font-size: 2.2rem;
            background: linear-gradient(90deg, #FF7900, #ffb347);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 2px;
        }
        .sr-badge {
            background: rgba(255, 121, 0, 0.1);
            border: 1px solid rgba(255, 121, 0, 0.3);
            border-radius: 8px;
            padding: 4px 10px;
            font-size: 1.2rem;
            color: #fff;
            box-shadow: inset 0 0 10px rgba(255,121,0,0.1);
        }

        /* Idea 2: Glassmorphic Monogram */
        .idea-2 {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
        }
        .monogram {
            position: relative;
            width: 60px;
            height: 60px;
        }
        .circle-1, .circle-2 {
            position: absolute;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            font-weight: 900;
        }
        .circle-1 {
            background: rgba(255, 121, 0, 0.8);
            top: 0; left: 0;
            z-index: 1;
            color: #000;
        }
        .circle-2 {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.2);
            bottom: 0; right: 0;
            z-index: 2;
            color: #fff;
        }
        .text-group-2 {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }
        .o-txt { font-size: 1.8rem; color: white; letter-spacing: 3px; line-height: 1; }
        .s-txt { font-size: 1rem; color: #FF7900; letter-spacing: 8px; line-height: 1.2; }
    </style>
</head>
<body>

    <div class="concept-container">
        <h2>Idea 1: Tech SVG & Glowing Tags Focus</h2>
        <div class="idea-1">
            <svg class="tech-icon" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 2L2 7l10 5 10-5-10-5z"></path>
                <path d="M2 17l10 5 10-5"></path>
                <path d="M2 12l10 5 10-5"></path>
            </svg>
            <div class="text-group">
                <span class="orange-txt">ORANGE</span>
                <span class="sr-badge">SR's</span>
            </div>
        </div>
    </div>

    <div class="concept-container">
        <h2>Idea 2: Glassmorphic Monogram Icon</h2>
        <div class="idea-2">
            <div class="monogram">
                <div class="circle-1">O</div>
                <div class="circle-2">S</div>
            </div>
            <div class="text-group-2">
                <span class="o-txt">ORANGE</span>
                <span class="s-txt">SYSTEMS</span>
            </div>
        </div>
    </div>

</body>
</html>
